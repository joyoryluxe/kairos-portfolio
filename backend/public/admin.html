<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kairos Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;display:flex;}
/* SIDEBAR */
#sidebar{width:260px;min-height:100vh;background:#161b27;border-right:1px solid #2d3748;display:flex;flex-direction:column;flex-shrink:0;}
#sidebar-header{padding:24px 20px;border-bottom:1px solid #2d3748;}
#sidebar-header h1{font-size:20px;font-weight:700;color:#63b3ed;letter-spacing:.5px;}
#sidebar-header p{font-size:11px;color:#718096;margin-top:4px;}
#page-nav{padding:16px 12px;flex:1;overflow-y:auto;}
.page-group{margin-bottom:8px;}
.page-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#4a5568;padding:8px 10px 4px;}
.section-btn{width:100%;text-align:left;background:none;border:none;color:#a0aec0;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;display:flex;align-items:center;gap:8px;}
.section-btn:hover{background:#2d3748;color:#e2e8f0;}
.section-btn.active{background:linear-gradient(135deg,#2b6cb0,#3182ce);color:#fff;font-weight:600;}
.section-btn .badge{margin-left:auto;font-size:9px;background:#2d3748;padding:2px 6px;border-radius:10px;color:#718096;}
.section-btn.active .badge{background:rgba(255,255,255,.2);color:#fff;}
/* MAIN */
#main{flex:1;overflow-y:auto;padding:32px;}
#top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
#top-bar h2{font-size:22px;font-weight:700;color:#fff;}
#breadcrumb{font-size:13px;color:#718096;margin-top:4px;}
.toast{position:fixed;top:24px;right:24px;padding:14px 20px;border-radius:10px;font-size:14px;font-weight:500;z-index:9999;transform:translateY(-80px);opacity:0;transition:all .4s;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{background:#22543d;color:#9ae6b4;border:1px solid #276749;}
.toast.error{background:#742a2a;color:#feb2b2;border:1px solid #9b2c2c;}
/* CARD */
.card{background:#161b27;border:1px solid #2d3748;border-radius:14px;padding:24px;margin-bottom:20px;}
.card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#4a90e2;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
.card-title::after{content:'';flex:1;height:1px;background:#2d3748;}
/* FORM */
.field-group{margin-bottom:16px;}
label{display:block;font-size:12px;font-weight:600;color:#a0aec0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
input[type=text],textarea,select{width:100%;background:#0f1117;border:1px solid #2d3748;border-radius:8px;padding:10px 14px;color:#e2e8f0;font-size:14px;transition:border .2s;font-family:inherit;resize:vertical;}
input[type=text]:focus,textarea:focus{outline:none;border-color:#3182ce;box-shadow:0 0 0 3px rgba(49,130,206,.2);}
textarea{min-height:90px;}
/* ARRAY EDITOR */
.array-editor{background:#0f1117;border:1px solid #2d3748;border-radius:10px;padding:14px;}
.array-item{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;background:#161b27;border:1px solid #2d3748;border-radius:8px;padding:10px 12px;}
.array-item-fields{flex:1;display:flex;flex-direction:column;gap:6px;}
.array-item-fields input{background:#0f1117;border:1px solid #2d3748;border-radius:6px;padding:7px 10px;color:#e2e8f0;font-size:13px;width:100%;}
.array-item-fields input:focus{outline:none;border-color:#3182ce;}
.remove-btn{background:#742a2a;border:none;color:#fc8181;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px;flex-shrink:0;transition:background .2s;}
.remove-btn:hover{background:#9b2c2c;}
.add-btn{display:inline-flex;align-items:center;gap:6px;background:#1a365d;border:1px solid #2b6cb0;color:#63b3ed;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:600;margin-top:8px;transition:all .2s;}
.add-btn:hover{background:#2b6cb0;color:#fff;}
/* ACTIONS */
.actions{display:flex;gap:12px;margin-top:24px;}
.btn-save{background:linear-gradient(135deg,#2b6cb0,#3182ce);border:none;color:#fff;border-radius:10px;padding:12px 28px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;}
.btn-save:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(49,130,206,.4);}
.btn-delete{background:#742a2a;border:none;color:#fc8181;border-radius:10px;padding:12px 20px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;}
.btn-delete:hover{background:#9b2c2c;}
/* EMPTY STATE */
#empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:#4a5568;text-align:center;}
#empty-state svg{width:64px;height:64px;margin-bottom:20px;opacity:.4;}
#empty-state h3{font-size:18px;margin-bottom:8px;color:#718096;}
/* LOADER */
.loader{display:flex;align-items:center;justify-content:center;height:200px;}
.spinner{width:36px;height:36px;border:3px solid #2d3748;border-top-color:#3182ce;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* NESTED */
.nested-card{background:#0f1117;border:1px solid #2d3748;border-radius:10px;padding:14px;margin-bottom:8px;}
.nested-card-header{font-size:12px;font-weight:700;color:#63b3ed;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>⚡ Kairos Admin</h1>
    <p>Content Management System</p>
  </div>
  <div id="page-nav">Loading...</div>
</div>

<div id="main">
  <div id="empty-state">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7M4 7c0-2 1-3 3-3h10c2 0 3 1 3 3M4 7h16M10 11h4"/></svg>
    <h3>Select a section to edit</h3>
    <p>Choose a page and section from the sidebar</p>
  </div>
  <div id="editor" style="display:none;"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let currentPage = null;
let currentSection = null;
let currentData = null;

// ─── TOAST ─────────────────────────────────────────────────────────────────
function showToast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'), 3000);
}

// ─── LOAD SIDEBAR ───────────────────────────────────────────────────────────
async function loadSidebar(){
  const nav = document.getElementById('page-nav');
  try {
    const r = await fetch(`${API}/api/sections/pages`);
    const j = await r.json();
    const pages = j.data || [];
    nav.innerHTML = '';

    for(const page of pages){
      const sectRes = await fetch(`${API}/api/sections/${page}`);
      const sectJ = await sectRes.json();
      const sections = sectJ.data || [];

      const grp = document.createElement('div');
      grp.className = 'page-group';
      grp.innerHTML = `<div class="page-group-label">📄 ${page}</div>`;

      sections.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'section-btn';
        btn.dataset.page = page;
        btn.dataset.section = s.section;
        btn.innerHTML = `<span>📝 ${s.section}</span>`;
        btn.onclick = () => loadEditor(page, s.section, btn);
        grp.appendChild(btn);
      });

      nav.appendChild(grp);
    }
  } catch(e){
    nav.innerHTML = `<div style="padding:16px;color:#fc8181;font-size:13px;">❌ Could not load pages.<br>Is the backend running?</div>`;
  }
}

// ─── LOAD EDITOR ─────────────────────────────────────────────────────────────
async function loadEditor(page, section, btnEl){
  document.querySelectorAll('.section-btn').forEach(b=>b.classList.remove('active'));
  btnEl.classList.add('active');

  currentPage = page;
  currentSection = section;

  document.getElementById('empty-state').style.display = 'none';
  const editor = document.getElementById('editor');
  editor.style.display = 'block';
  editor.innerHTML = `<div class="loader"><div class="spinner"></div></div>`;

  try {
    const r = await fetch(`${API}/api/sections/${page}/${section}`);
    if(!r.ok) throw new Error('Not found');
    const j = await r.json();
    currentData = j.data;
    renderEditor(currentData, editor);
  } catch(e){
    editor.innerHTML = `<div style="color:#fc8181;padding:20px;">Error loading section: ${e.message}</div>`;
  }
}

// ─── RENDER EDITOR ───────────────────────────────────────────────────────────
function renderEditor(data, container){
  const page = data.page;
  const section = data.section;

  let html = `
  <div id="top-bar">
    <div>
      <h2>${section}</h2>
      <div id="breadcrumb">${page} → ${section}</div>
    </div>
  </div>`;

  // TEXT FIELDS CARD
  const textFields = [
    {key:'title', label:'Title'},
    {key:'subtitle', label:'Subtitle'},
    {key:'description', label:'Description', textarea:true},
    {key:'banner', label:'Banner Image URL'},
    {key:'mobileBanner', label:'Mobile Banner URL'},
    {key:'hashtag', label:'Hashtag'},
    {key:'heroImage', label:'Hero Image URL'},
    {key:'breadcrumb', label:'Breadcrumb Text'},
  ];

  const relevantText = textFields.filter(f => data[f.key] !== undefined && data[f.key] !== '');
  if(relevantText.length > 0){
    html += `<div class="card"><div class="card-title">Basic Info</div>`;
    relevantText.forEach(f => {
      if(f.textarea){
        html += `<div class="field-group"><label>${f.label}</label><textarea id="field-${f.key}">${esc(data[f.key]||'')}</textarea></div>`;
      } else {
        html += `<div class="field-group"><label>${f.label}</label><input type="text" id="field-${f.key}" value="${esc(data[f.key]||'')}"/></div>`;
      }
    });
    html += `</div>`;
  }

  // SERVICE ITEMS
  if(data.serviceItems !== undefined){
    html += buildArrayCard('serviceItems', data.serviceItems, [
      {key:'id', label:'ID', type:'number'},
      {key:'title', label:'Title'},
      {key:'image', label:'Image URL'}
    ], 'Service Items');
  }

  // BEST SHOT ITEMS
  if(data.bestShotItems !== undefined){
    html += buildArrayCard('bestShotItems', data.bestShotItems, [
      {key:'id', label:'ID', type:'number'},
      {key:'image', label:'Image URL'}
    ], 'Best Shot Photos');
  }

  // STATS
  if(data.stats !== undefined){
    html += buildArrayCard('stats', data.stats, [
      {key:'id', label:'ID', type:'number'},
      {key:'number', label:'Number (e.g. 100+)'},
      {key:'label', label:'Label'}
    ], 'Stats');
  }

  // ABOUT
  if(data.about && (data.about.title1 || data.about.text1)){
    html += `<div class="card"><div class="card-title">About Section</div>`;
    ['title1','text1','title2','text2'].forEach(k => {
      const isText = k.startsWith('text');
      if(isText){
        html += `<div class="field-group"><label>${k}</label><textarea id="field-about-${k}">${esc(data.about[k]||'')}</textarea></div>`;
      } else {
        html += `<div class="field-group"><label>${k}</label><input type="text" id="field-about-${k}" value="${esc(data.about[k]||'')}"/></div>`;
      }
    });
    html += `<div class="field-group"><label>Founder Image URL</label><input type="text" id="field-about-image" value="${esc(data.about.image||'')}"/></div>`;
    html += `</div>`;
  }

  // PRICING CARDS
  if(data.pricingCards !== undefined){
    html += buildArrayCard('pricingCards', data.pricingCards, [
      {key:'id', label:'ID (slug)'},
      {key:'title', label:'Title'},
      {key:'cardImage', label:'Card Image URL'}
    ], 'Pricing Cards');
  }

  // PACKAGES
  if(data.packages !== undefined && data.packages.length > 0){
    html += `<div class="card"><div class="card-title">Packages</div><div class="array-editor" id="array-packages">`;
    data.packages.forEach((pkg, i) => {
      html += `<div class="nested-card" id="pkg-${i}">
        <div class="nested-card-header">Package ${i+1}</div>
        <div class="field-group"><label>Name</label><input type="text" class="pkg-name" data-idx="${i}" value="${esc(pkg.name||'')}"/></div>
        <div class="field-group"><label>Price</label><input type="text" class="pkg-price" data-idx="${i}" value="${esc(pkg.price||'')}"/></div>
        <div class="field-group"><label>Features (one per line)</label><textarea class="pkg-features" data-idx="${i}">${(pkg.features||[]).join('\n')}</textarea></div>
        <button class="remove-btn" onclick="removePkg(${i})">✕ Remove</button>
      </div>`;
    });
    html += `</div>
    <button class="add-btn" onclick="addPkg()">+ Add Package</button></div>`;
  }

  // ADD-ONS
  if(data.addOns !== undefined){
    html += buildArrayCard('addOns', data.addOns, [
      {key:'name', label:'Add-on Name'},
      {key:'price', label:'Price'}
    ], 'Add-Ons');
  }

  // NOTES
  if(data.notes !== undefined && data.notes.length > 0){
    html += `<div class="card"><div class="card-title">Notes</div>
    <div class="array-editor" id="array-notes">`;
    data.notes.forEach((n,i) => {
      html += `<div class="array-item"><div class="array-item-fields"><textarea class="note-item">${esc(n)}</textarea></div>
      <button class="remove-btn" onclick="this.closest('.array-item').remove()">✕</button></div>`;
    });
    html += `</div><button class="add-btn" onclick="addNote()">+ Add Note</button></div>`;
  }

  // SECTIONS (service photo sections)
  if(data.sections !== undefined && data.sections.length > 0){
    html += `<div class="card"><div class="card-title">Photo Sections</div><div id="photo-sections">`;
    data.sections.forEach((sec, i) => {
      html += `<div class="nested-card" id="psec-${i}">
        <div class="nested-card-header">Section ${i+1}</div>
        <div class="field-group"><label>Title</label><input type="text" class="psec-title" data-idx="${i}" value="${esc(sec.title||'')}"/></div>
        <div class="field-group"><label>Images (one URL per line)</label><textarea class="psec-images" data-idx="${i}">${(sec.images||[]).join('\n')}</textarea></div>
        <button class="remove-btn" onclick="document.getElementById('psec-${i}').remove()">✕ Remove</button>
      </div>`;
    });
    html += `</div><button class="add-btn" onclick="addPhotoSection()">+ Add Section</button></div>`;
  }

  // ACTIONS
  html += `<div class="actions">
    <button class="btn-save" onclick="saveSection()">💾 Save Changes</button>
    <button class="btn-delete" onclick="deleteSection()">🗑 Delete Section</button>
  </div>`;

  container.innerHTML = html;
}

// ─── ARRAY CARD BUILDER ──────────────────────────────────────────────────────
function buildArrayCard(key, items, fields, label){
  let html = `<div class="card"><div class="card-title">${label}</div>
  <div class="array-editor" id="array-${key}">`;
  (items||[]).forEach((item, i) => {
    html += `<div class="array-item"><div class="array-item-fields">`;
    fields.forEach(f => {
      html += `<input type="text" data-key="${key}" data-field="${f.key}" data-idx="${i}" value="${esc(String(item[f.key]||''))}" placeholder="${f.label}"/>`;
    });
    html += `</div><button class="remove-btn" onclick="this.closest('.array-item').remove()">✕</button></div>`;
  });
  html += `</div>
  <button class="add-btn" onclick="addArrayItem('${key}', ${JSON.stringify(fields)})">+ Add Item</button></div>`;
  return html;
}

function addArrayItem(key, fields){
  const container = document.getElementById(`array-${key}`);
  const i = Date.now();
  const div = document.createElement('div');
  div.className = 'array-item';
  div.innerHTML = `<div class="array-item-fields">${fields.map(f=>`<input type="text" data-key="${key}" data-field="${f.key}" data-idx="${i}" placeholder="${f.label}"/>`).join('')}</div>
  <button class="remove-btn" onclick="this.closest('.array-item').remove()">✕</button>`;
  container.appendChild(div);
}

function addNote(){
  const c = document.getElementById('array-notes');
  const div = document.createElement('div');
  div.className = 'array-item';
  div.innerHTML = `<div class="array-item-fields"><textarea class="note-item" placeholder="Enter note..."></textarea></div>
  <button class="remove-btn" onclick="this.closest('.array-item').remove()">✕</button>`;
  c.appendChild(div);
}

function addPkg(){
  const c = document.getElementById('array-packages');
  const i = Date.now();
  const div = document.createElement('div');
  div.className = 'nested-card';
  div.innerHTML = `<div class="nested-card-header">New Package</div>
  <div class="field-group"><label>Name</label><input type="text" class="pkg-name" data-idx="${i}" placeholder="Package name"/></div>
  <div class="field-group"><label>Price</label><input type="text" class="pkg-price" data-idx="${i}" placeholder="e.g. Rs 4500"/></div>
  <div class="field-group"><label>Features (one per line)</label><textarea class="pkg-features" data-idx="${i}" placeholder="Feature 1&#10;Feature 2"></textarea></div>
  <button class="remove-btn" onclick="this.closest('.nested-card').remove()">✕ Remove</button>`;
  c.appendChild(div);
}

function addPhotoSection(){
  const c = document.getElementById('photo-sections');
  const i = Date.now();
  const div = document.createElement('div');
  div.className = 'nested-card';
  div.innerHTML = `<div class="nested-card-header">New Section</div>
  <div class="field-group"><label>Title</label><input type="text" class="psec-title" data-idx="${i}" placeholder="Section title"/></div>
  <div class="field-group"><label>Images (one URL per line)</label><textarea class="psec-images" data-idx="${i}" placeholder="/image1.webp&#10;/image2.webp"></textarea></div>
  <button class="remove-btn" onclick="this.closest('.nested-card').remove()">✕ Remove</button>`;
  c.appendChild(div);
}

// ─── COLLECT FORM DATA ───────────────────────────────────────────────────────
function collectFormData(){
  const out = {};

  // Text fields
  const textKeys = ['title','subtitle','description','banner','mobileBanner','hashtag','heroImage','breadcrumb'];
  textKeys.forEach(k => {
    const el = document.getElementById(`field-${k}`);
    if(el) out[k] = el.value;
  });

  // About
  const aboutFields = ['title1','text1','title2','text2','image'];
  const aboutData = {};
  let hasAbout = false;
  aboutFields.forEach(k => {
    const el = document.getElementById(`field-about-${k}`);
    if(el){ aboutData[k] = el.value; hasAbout = true; }
  });
  if(hasAbout) out.about = aboutData;

  // Generic array fields
  const arrayKeys = ['serviceItems','bestShotItems','stats','addOns','pricingCards'];
  arrayKeys.forEach(key => {
    const container = document.getElementById(`array-${key}`);
    if(!container) return;
    const items = container.querySelectorAll('.array-item');
    const arr = [];
    items.forEach(item => {
      const inputs = item.querySelectorAll('input[data-field]');
      if(!inputs.length) return;
      const obj = {};
      inputs.forEach(inp => {
        obj[inp.dataset.field] = inp.value;
      });
      arr.push(obj);
    });
    out[key] = arr;
  });

  // Packages
  const pkgContainer = document.getElementById('array-packages');
  if(pkgContainer){
    const names = pkgContainer.querySelectorAll('.pkg-name');
    const prices = pkgContainer.querySelectorAll('.pkg-price');
    const featureAreas = pkgContainer.querySelectorAll('.pkg-features');
    const pkgs = [];
    names.forEach((n, i) => {
      pkgs.push({
        name: n.value,
        price: prices[i]?.value || '',
        features: (featureAreas[i]?.value || '').split('\n').map(f=>f.trim()).filter(Boolean)
      });
    });
    out.packages = pkgs;
  }

  // Notes
  const notesContainer = document.getElementById('array-notes');
  if(notesContainer){
    const noteEls = notesContainer.querySelectorAll('.note-item');
    out.notes = Array.from(noteEls).map(n=>n.value.trim()).filter(Boolean);
  }

  // Photo sections
  const psecContainer = document.getElementById('photo-sections');
  if(psecContainer){
    const titles = psecContainer.querySelectorAll('.psec-title');
    const imgs = psecContainer.querySelectorAll('.psec-images');
    const secs = [];
    titles.forEach((t,i) => {
      secs.push({
        title: t.value,
        images: (imgs[i]?.value||'').split('\n').map(u=>u.trim()).filter(Boolean)
      });
    });
    out.sections = secs;
  }

  return out;
}

// ─── SAVE SECTION ─────────────────────────────────────────────────────────────
async function saveSection(){
  const payload = collectFormData();
  try {
    const r = await fetch(`${API}/api/sections/${currentPage}/${currentSection}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if(j.success){
      showToast('✅ Section saved successfully!');
      currentData = j.data;
    } else {
      showToast('❌ Save failed: ' + j.message, 'error');
    }
  } catch(e){
    showToast('❌ Network error: ' + e.message, 'error');
  }
}

// ─── DELETE SECTION ───────────────────────────────────────────────────────────
async function deleteSection(){
  if(!confirm(`Delete section "${currentSection}" from page "${currentPage}"? This cannot be undone.`)) return;
  try {
    const r = await fetch(`${API}/api/sections/${currentPage}/${currentSection}`, { method: 'DELETE' });
    const j = await r.json();
    if(j.success){
      showToast('🗑 Section deleted.');
      document.getElementById('editor').style.display = 'none';
      document.getElementById('empty-state').style.display = 'flex';
      loadSidebar();
    } else {
      showToast('❌ Delete failed: ' + j.message, 'error');
    }
  } catch(e){
    showToast('❌ Network error', 'error');
  }
}

function esc(str){ return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// INIT
loadSidebar();
</script>
</body>
</html>
